version: 2.1

executors:
  macos-exec:
    macos:
      xcode: "15.4.0"
    resource_class: macos.m1.medium.gen1
    working_directory: ~/sttmd

jobs:
  build-mac:
    executor: macos-exec
    environment:
      APPLE_ID: $APPLE_ID
      APPLE_APP_SPECIFIC_PASSWORD: $APPLE_APP_SPECIFIC_PASSWORD
      APPLE_TEAM_ID: $APPLE_TEAM_ID
      CSC_LINK: $CSC_LINK
      CSC_KEY_PASSWORD: $CSC_KEY_PASSWORD
    steps:
      - checkout
      - run:
          name: Ensure Python distutils support
          command: |
            # install setuptools (which brings back distutils)
            brew install python-setuptools    # Homebrew formula for setuptools :contentReference[oaicite:2]{index=2}
            python3 -m pip install --upgrade setuptools

      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}

      - run:
          name: Verify nvm Installation, Install Node.js v18, Build & Package macOS App
          # run in a login shell so ~/.bash_profile / ~/.bashrc are loaded
          command: |
            if ! command -v nvm &> /dev/null; then
              echo "nvm could not be found, installing..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi
            # if NVM was installed in $HOME:
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            nvm install v18.18.0
            nvm use v18.18.0

            npm install

      - run:
          name: Import Code Signing Certificate
          command: |
            chmod +x packaging/add-osx-cert.sh
            packaging/add-osx-cert.sh
            npm run dist:macArm

      - run:
          name: Locate & rename DMG
          command: |
            # find the one file that matches your pattern
            SRC=$(ls builds/SikhiToTheMax-*-arm64.dmg)
            echo "Found $SRC"
            # rename it to a fixed name
            cp "$SRC" SikhiToTheMax-arm64-latest.dmg

      - store_artifacts:
          path: SikhiToTheMax-arm64-latest.dmg

      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules

workflows:
  build:
    jobs:
      - build-mac
